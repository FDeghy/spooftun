name: Build
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request: {}
  workflow_dispatch: {}
jobs:
  build:
    # Linux packet I/O is tested natively on both supported architectures.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l *.go)"
      - name: Test
        run: go test ./...
      - name: Network test dependencies
        if: matrix.goarch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ethtool iproute2 iperf3 iputils-ping
      - name: Namespace integration
        if: matrix.goarch == 'amd64'
        run: sudo env PATH="$PATH" SPOOFTUN_NETNS_TEST=1 go test -run 'TestNetworkNamespaceIntegration|TestServerOutboundPortIntegration|TestNoiseIntegration' -v .
      - name: XDP filter validation
        if: matrix.goarch == 'amd64'
        run: sudo env PATH="$PATH" SPOOFTUN_XDP_TEST=1 go test -run 'TestXDPKernelFilter|TestXDPExplicitCustomDestination' -v .
      - name: Benchmark harness tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: TUN namespace validation
        if: matrix.goarch == 'amd64'
        run: |
          go build -o /tmp/spooftun-tun-test .
          sudo python3 scripts/bench-tun.py --binary /tmp/spooftun-tun-test --output /tmp/spooftun-tun-default --workers 2 --verify-only
          sudo python3 scripts/bench-tun.py --binary /tmp/spooftun-tun-test --output /tmp/spooftun-tun-frag --fake-frag --fake-tcp --verify-only
      - name: Race
        run: go test -race ./...
      - name: Staticcheck
        if: matrix.goarch == 'amd64'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Build
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
        run: go build -v -trimpath -ldflags="-s -w" -o spooftun-linux-${{ matrix.goarch }} .
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: spooftun-linux-${{ matrix.goarch }}
          path: spooftun-linux-${{ matrix.goarch }}
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
