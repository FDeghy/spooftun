name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    # main.go is behind //go:build linux and gopacket/pcap needs libpcap via cgo,
    # so this must run on a Linux runner.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v -o spooftun .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: spooftun-linux-amd64
          path: spooftun
